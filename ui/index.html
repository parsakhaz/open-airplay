<!doctype html>
<html lang="en" data-mode="compact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open-airplay</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="oai-icon-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#0a6cff"/></linearGradient>
      <symbol id="i-app" viewBox="0 0 1024 1024">
        <rect width="1024" height="1024" rx="224" fill="url(#oai-icon-bg)"/>
        <rect x="208" y="256" width="608" height="416" rx="64" fill="none" stroke="#fff" stroke-width="56"/>
        <path d="M512 576 L672 784 H352 Z" fill="#fff" stroke="url(#oai-icon-bg)" stroke-width="40" stroke-linejoin="round" paint-order="stroke"/>
      </symbol>
      <symbol id="i-pc" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 13.5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-phone" viewBox="0 0 16 16"><rect x="4.5" y="1.5" width="7" height="13" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
      <symbol id="i-tv" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 13.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="9.5" r="2" fill="currentColor"/></symbol>
      <symbol id="i-laptop" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 12.5h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
      <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 1.8 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6v3.6M8 11.6v.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-min" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></symbol>
      <symbol id="i-max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
      <symbol id="i-restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 2.5V.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/></symbol>
      <symbol id="i-expand" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-collapse" viewBox="0 0 16 16"><path d="M13 7H9V3M3 9h4v4M9 7l4.5-4.5M7 9l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-fullscreen" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0 0 10" stroke="currentColor" stroke-width="1"/></symbol>
    </defs>
  </svg>

  <!-- Compact: the tray popover (primary surface) -->
  <div class="compact" id="compact">
    <section class="oai-popover" aria-label="open-airplay">
      <header class="oai-popover-head" data-tauri-drag-region>
        <svg class="oai-app-icon" data-tauri-drag-region><use href="#i-app"/></svg>
        <div data-tauri-drag-region style="min-width:0"><div class="oai-t" data-tauri-drag-region>AirPlay Receiver</div><div class="oai-s" id="pop-sub" data-tauri-drag-region>Starting…</div></div>
        <input type="checkbox" class="oai-switch" id="rx-switch" aria-label="Receiving">
      </header>
      <div class="oai-popover-body" id="pop-body"></div>
      <footer class="oai-popover-foot">
        <button class="oai-ghost" id="pop-settings"><svg><use href="#i-gear"/></svg>Settings</button>
        <span class="oai-spacer"></span>
        <button class="oai-ghost" id="pop-expand" title="Open the full view"><svg><use href="#i-expand"/></svg>Expand</button>
      </footer>
    </section>
  </div>

  <!-- Full view (on demand) -->
  <div class="oai-window" id="full">
    <header class="oai-titlebar" data-tauri-drag-region>
      <svg class="oai-app-icon" data-tauri-drag-region><use href="#i-app"/></svg>
      <span class="oai-title" data-tauri-drag-region>open-airplay</span>
      <div class="oai-window-controls">
        <button id="win-collapse" aria-label="Back to compact view" title="Back to compact (Esc)"><svg style="width:13px;height:13px"><use href="#i-collapse"/></svg></button>
        <button id="win-fullscreen" aria-label="Full screen" title="Full screen (F11)"><svg style="width:13px;height:13px"><use href="#i-fullscreen"/></svg></button>
        <button id="win-min" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
        <button id="win-max" aria-label="Maximize"><svg><use id="win-max-icon" href="#i-max"/></svg></button>
        <button id="win-close" class="oai-close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
      </div>
    </header>

    <div class="oai-body">
      <nav class="oai-sidebar" aria-label="Devices">
        <div class="oai-sidebar-group">Receive</div>
        <button class="oai-sidebar-item" data-view="receive" aria-current="true">
          <svg><use id="receive-icon" href="#i-pc"/></svg><span class="oai-label" id="receive-label">This PC</span><span class="oai-dot" id="receive-dot"></span>
        </button>

        <div class="oai-sidebar-group">Send to
          <button class="oai-btn is-icon is-small scan-btn" id="scan" aria-label="Find AirPlay devices" title="Find AirPlay devices"><svg><use href="#i-refresh"/></svg></button>
        </div>
        <div id="devices"></div>
        <div class="oai-sidebar-empty" id="devices-empty">Press ↻ to find Apple TVs and speakers.</div>

        <div class="oai-sidebar-group">App</div>
        <button class="oai-sidebar-item" data-view="settings"><svg><use href="#i-gear"/></svg><span class="oai-label">Settings</span></button>

        <div class="oai-sidebar-foot"><svg><use href="#i-pc"/></svg><span id="foot-name">This PC</span></div>
      </nav>

      <main class="oai-content">
        <div class="oai-toolbar">
          <div><div class="oai-toolbar-title" id="tb-title">This PC</div><div class="oai-toolbar-sub" id="tb-sub"></div></div>
          <div class="oai-toolbar-tools" id="tb-tools"></div>
        </div>
        <div class="oai-stage" id="stage"></div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
