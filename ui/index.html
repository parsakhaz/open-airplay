<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open-airplay</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="oai-icon-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#0a6cff"/></linearGradient>
      <symbol id="i-app" viewBox="0 0 1024 1024">
        <rect width="1024" height="1024" rx="224" fill="url(#oai-icon-bg)"/>
        <rect x="208" y="256" width="608" height="416" rx="64" fill="none" stroke="#fff" stroke-width="56"/>
        <path d="M512 576 L672 784 H352 Z" fill="#fff" stroke="url(#oai-icon-bg)" stroke-width="40" stroke-linejoin="round" paint-order="stroke"/>
      </symbol>
      <symbol id="i-pc" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 13.5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-phone" viewBox="0 0 16 16"><rect x="4.5" y="1.5" width="7" height="13" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
      <symbol id="i-tv" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 13.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="9.5" r="2" fill="currentColor"/></symbol>
      <symbol id="i-laptop" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 12.5h13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 1.8 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6v3.6M8 11.6v.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-music" viewBox="0 0 16 16"><path d="M6 12V3.5l7-1.5v8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="4.3" cy="12" r="1.8" fill="currentColor"/><circle cx="11.3" cy="10.5" r="1.8" fill="currentColor"/></symbol>
      <symbol id="i-prev" viewBox="0 0 16 16"><path d="M3.5 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13 3.2v9.6L5.5 8z" fill="currentColor"/></symbol>
      <symbol id="i-next" viewBox="0 0 16 16"><path d="M12.5 3v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 3.2v9.6L10.5 8z" fill="currentColor"/></symbol>
      <symbol id="i-playpause" viewBox="0 0 16 16"><path d="M1.5 3.2v9.6L8 8z" fill="currentColor"/><path d="M10.5 3.5v9M14 3.5v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-volume" viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10l-3.5-3H2z" fill="currentColor"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.3 6.3 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-chev"viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <!-- The tray panel: the app's only window. Regions are filled by app.js. -->
  <section class="oai-popover" id="panel" aria-label="open-airplay">
    <header class="oai-popover-head" id="panel-head">
      <svg class="oai-app-icon"><use href="#i-app"/></svg>
      <div style="min-width:0"><div class="oai-t">AirPlay Receiver</div><div class="oai-s" id="pop-sub">Starting…</div></div>
      <input type="checkbox" class="oai-switch" id="rx-switch" aria-label="Receiving" title="Turn on receiving">
    </header>
    <div class="oai-popover-body" id="pop-body">
      <div id="pop-content">
        <div class="region-error" id="r-switch-error" hidden></div>

        <div class="pop-page" id="page-home">
          <div id="r-notice"></div>
          <div id="r-status"></div>
          <div id="r-findings"></div>
          <div class="oai-sep"></div>
          <div id="r-devices"></div>
        </div>

        <div class="pop-page" id="page-settings" hidden>
          <button class="oai-ghost oai-back" data-action="home">‹ Back</button>
          <form class="settings-form" autocomplete="off">
            <label class="oai-list-row"><span class="oai-grow"><span>Name</span><small class="oai-sub" style="display:block">Shown in Screen Mirroring</small></span><input class="oai-input" data-set="name" required maxlength="63"></label>
            <label class="oai-list-row"><span class="oai-grow"><span>Require a PIN</span><small class="oai-sub" style="display:block">Every new connection enters a code</small></span><input type="checkbox" class="oai-switch" data-set="pin_mode"></label>
            <label class="oai-list-row"><span class="oai-grow"><span>High-efficiency video</span><small class="oai-sub" style="display:block">Turn on if a newer iPhone can't connect</small></span><input type="checkbox" class="oai-switch" data-set="h265"></label>
            <label class="oai-list-row"><span class="oai-grow"><span>Start at login</span><small class="oai-sub" style="display:block">Open quietly in the tray when you sign in</small></span><input type="checkbox" class="oai-switch" data-pref="startAtLogin"></label>
            <div class="status-line" id="r-settings-status"></div>
          </form>
        </div>

        <div class="pop-page" id="page-cast" hidden>
          <button class="oai-ghost oai-back" data-action="home">‹ Back</button>
          <div id="r-cast-head"></div>
          <div class="pop-cast">
            <div class="row" id="cast-url-row"><input class="oai-input" data-cast="url" type="url" placeholder="Video or audio link"><button class="oai-btn is-primary is-small" data-action="play-url">Play</button></div>
            <div class="row"><input class="oai-input" data-cast="file" placeholder="C:\Music\song.mp3"><button class="oai-btn is-small" data-action="stream-file">Stream</button></div>
            <div class="msg" id="r-cast-msg"></div>
          </div>
        </div>
      </div>
    </div>
    <footer class="oai-popover-foot" id="panel-foot">
      <button class="oai-ghost" data-action="settings"><svg><use href="#i-gear"/></svg>Settings</button>
    </footer>
  </section>

  <script src="app.js"></script>
</body>
</html>
