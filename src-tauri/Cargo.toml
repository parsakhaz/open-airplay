[package]
name = "open-airplay"
version = "0.1.0"
description = "Open-source AirPlay receiver and sender with a shell that behaves"
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "open_airplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
mdns-sd = "0.21.5"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Cast pairings in Credential Manager. Windows only: elsewhere keyring would fall back to a store that keeps nothing.
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
