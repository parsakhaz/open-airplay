[package]
name = "open-airplay"
version = "0.1.0"
description = "Open-source AirPlay receiver and sender with a shell that behaves"
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "open_airplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
