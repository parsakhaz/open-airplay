name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build the Windows
# installer and publish it as a GitHub Release. Running it by hand (workflow_dispatch) builds
# the installer as a workflow artifact without creating a release, as a dry run; so does any
# pull request that edits this workflow.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The installer version comes from the tag (v0.1.0 -> 0.1.0). Dry runs keep the config version.
      - name: Version from tag
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag $REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
              exit 1
            fi
          else
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          # 0.x versions and -suffixed tags are published as prereleases.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building open-airplay $version (prerelease: $prerelease)"

      # Receiver engine: the same MSYS2 UCRT64 build as CI's engine job. build-engine.sh installs
      # its own toolchain and GStreamer packages, runs the C tests, then stages engine/runtime,
      # which tauri.windows.conf.json bundles into the installer.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git

      - name: Build and stage receiver engine
        shell: msys2 {0}
        run: bash engine/build-engine.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # beforeBuildCommand syncs the design tokens into ui/. --config overrides the version only.
      - name: Build installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx tauri build --config "{\"version\":\"$VERSION\"}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-airplay-${{ steps.version.outputs.version }}-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: open-airplay ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          body: |
            Download `open-airplay_${{ steps.version.outputs.version }}_x64-setup.exe` below and run it. It bundles the UxPlay receiver engine, so it is fairly large.
            The installer is not code signed yet, so Windows SmartScreen may warn: choose **More info**, then **Run anyway**.
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
